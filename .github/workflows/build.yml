name: Build & Check

on:
  push:
    branches: [master]
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same ref, so CI minutes
# aren't spent finishing a build that's already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Crux core is plain Rust — build and unit-test it natively (the Android
  # shell mirrors this logic; see README).
  core:
    name: Crux core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the Crux core
        working-directory: shared
        run: cargo test

  build:
    name: Android app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-debug.apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
