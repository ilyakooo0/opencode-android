name: Build & Check

on:
  push:
    branches: [master]
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same ref, so CI minutes
# aren't spent finishing a build that's already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Decode release keystore
        run: |
          mkdir -p keystore
          printf '%s' "$OPENCODE_STORE_BASE64" | base64 -d > keystore/opencode-release.jks
        env:
          OPENCODE_STORE_BASE64: ${{ secrets.OPENCODE_STORE_BASE64 }}

      - name: Build release APK
        env:
          OPENCODE_STORE_FILE: ${{ github.workspace }}/keystore/opencode-release.jks
          OPENCODE_STORE_PASSWORD: ${{ secrets.OPENCODE_STORE_PASSWORD }}
          OPENCODE_KEY_ALIAS: ${{ secrets.OPENCODE_KEY_ALIAS }}
          OPENCODE_KEY_PASSWORD: ${{ secrets.OPENCODE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-debug.apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The release output dir is `release/` when unsigned but `release-signed/` (or a
      # variant name) once a signing config is applied. Match both so CI keeps working
      # once the OPENCODE_STORE_* secrets are wired up.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-release.apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
