name: Release

# Build a minified, signed release APK and publish it as a GitHub Release.
#
# Runs automatically on every push to `master` (e.g. a merged PR), on a pushed
# version tag (e.g. `git tag v1.2.0 && git push --tags`), or manually from the
# Actions tab (workflow_dispatch). For a branch push or manual run the version
# is derived from the current UTC time as YYYY.MM.DD.HHMM; a tag push uses the
# tag name (with the leading `v` stripped) as the version.
#
# The `v*` tag this workflow pushes when publishing a release does NOT retrigger
# it: events created with the default GITHUB_TOKEN don't start new workflow runs.
#
# Signing: if the `OPENCODE_STORE_*` secrets are configured the APK is signed
# with that keystore; otherwise the Gradle build falls back to the debug key so
# the released APK is still installable (see app/build.gradle.kts). The version
# is passed to Gradle as `-PversionName/-PversionCode` and stamped into the APK.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# Never abort a release mid-flight — a half-published release with a missing
# artifact is worse than a slightly delayed one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and create the release
      id-token: write # OIDC so GitHub can sign the provenance attestation
      attestations: write # publish the attestation record
    env:
      OPENCODE_STORE_BASE64: ${{ secrets.OPENCODE_STORE_BASE64 }}
      OPENCODE_STORE_PASSWORD: ${{ secrets.OPENCODE_STORE_PASSWORD }}
      OPENCODE_KEY_ALIAS: ${{ secrets.OPENCODE_KEY_ALIAS }}
      OPENCODE_KEY_PASSWORD: ${{ secrets.OPENCODE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the versionCode (git rev-list --count HEAD) is
          # accurate instead of collapsing to 1 on a shallow clone.
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(TZ=UTC date +%Y.%m.%d.%H%M)"
            TAG="v${VERSION}"
          fi
          CODE="$(git rev-list --count HEAD)"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "code=$CODE"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $VERSION, code $CODE)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The keystore ships as base64 in a secret so it never touches the repo.
      # Job-level env makes OPENCODE_STORE_BASE64 available to this `if`.
      - name: Decode signing keystore
        if: env.OPENCODE_STORE_BASE64 != ''
        run: |
          STORE_FILE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$OPENCODE_STORE_BASE64" | base64 -d > "$STORE_FILE"
          echo "OPENCODE_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            --no-daemon

      # Rename to a stable, version-tagged filename for the release attachment.
      - name: Stage APK
        run: |
          mkdir -p staging
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          cp "$APK" "staging/opencode-${{ steps.version.outputs.version }}.apk"

      # Signed build-provenance attestation for the exact artifact being
      # published; later verifiable with `gh attestation verify <apk>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: staging/*.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: staging/*.apk
