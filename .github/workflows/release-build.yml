name: Release Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The keystore ships as base64 in a secret so it never touches the repo.
      # When the secret isn't configured the Gradle build falls back to an
      # unsigned APK, so this workflow is green even before signing is wired up.
      - name: Decode signing keystore
        if: env.OPENCODE_STORE_BASE64 != ''
        env:
          OPENCODE_STORE_BASE64: ${{ secrets.OPENCODE_STORE_BASE64 }}
        run: |
          STORE_FILE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$OPENCODE_STORE_BASE64" | base64 -d > "$STORE_FILE"
          echo "OPENCODE_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          OPENCODE_STORE_FILE: ${{ env.OPENCODE_STORE_FILE }}
          OPENCODE_STORE_PASSWORD: ${{ secrets.OPENCODE_STORE_PASSWORD }}
          OPENCODE_KEY_ALIAS: ${{ secrets.OPENCODE_KEY_ALIAS }}
          OPENCODE_KEY_PASSWORD: ${{ secrets.OPENCODE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
