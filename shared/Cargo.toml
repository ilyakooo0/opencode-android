[package]
name = "shared"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Crux core for the opencode Android client"

[lib]
# `lib` for native cargo test + typegen; cdylib/staticlib keep the door open for a
# real JNI build once an Android cross-toolchain (NDK + rust-std) is available.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "codegen"
required-features = ["typegen"]

[features]
typegen = ["crux_core/typegen", "dep:anyhow"]

[dependencies]
crux_core = "0.19"
crux_http = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

anyhow = { version = "1", optional = true }

[dev-dependencies]
crux_core = { version = "0.19", features = ["testing"] }
